<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Room | Study Together</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">

  <!-- Immediate Theme Loader to prevent flicker -->
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- Top bar with room title and back button -->
  <header class="room-header">
    <div class="room-info">
      <a href="lobby.html" class="logo" style="font-size: 1.15rem;">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </span>
        <span>Study Together</span>
      </a>
      
      <span style="color: var(--border-color); font-size: 1.2rem; font-weight: 300;">/</span>

      <!-- Room title & vibe badge updated from URL params -->
      <span class="room-name-display" id="current-room-name">Study Room</span>
      <span class="stamp-badge" id="room-vibe-badge">Cozy Vibe</span>

      <!-- Live participant pill -->
      <span class="badge badge-live">
        <span class="pulse-dot"></span>
        <span id="room-participant-count">14 studying now</span>
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <!-- Theme Toggle Button -->
      <button type="button" class="theme-toggle-btn" aria-label="Toggle dark/light mode">
        <span class="theme-toggle-icon"></span>
        <span class="theme-toggle-text">Day Paper</span>
      </button>

      <a href="lobby.html" class="btn btn-danger btn-sm" id="leave-room-btn">
        &larr; Leave Desk
      </a>
    </div>
  </header>

  <!-- Split study room layout -->
  <main class="room-layout">
    
    <!-- Left panel: Jitsi Video Call framed as a scrapbook Polaroid/Desk Screen -->
    <section class="video-panel">
      <!-- Decorative washi tape on video corners -->
      <span class="washi-tape tape-sage tape-corner-left"></span>
      <span class="washi-tape tape-rose tape-corner-right"></span>

      <div class="video-header-bar">
        <span style="display: inline-flex; align-items: center; gap: 6px;">
          <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          Silent Co-Working Space
        </span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-dim); font-family: var(--font-hand); font-size: 1.15rem;">
          <svg class="icon-svg icon-sm" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          mic &amp; camera muted by default
        </span>
      </div>

      <div class="video-container">
        <!-- Jitsi Meet iframe (src set dynamically in js/room.js) -->
        <iframe 
          id="jitsi-iframe"
          title="Video Co-Working"
          allow="camera; microphone; fullscreen; display-capture; autoplay"
        ></iframe>
      </div>
    </section>

    <!-- Right panel: Timer & To-Do List -->
    <aside class="tools-panel">

      <!-- Pomodoro Timer (Retro Stopwatch / Craft Clock) -->
      <div class="timer-card">
        <span class="washi-tape tape-honey" style="width: 90px; top: -10px;"></span>

        <div class="timer-mode-selector">
          <button type="button" class="timer-mode-btn active" data-mode="focus">Focus (25m)</button>
          <button type="button" class="timer-mode-btn" data-mode="shortBreak">Break (5m)</button>
          <button type="button" class="timer-mode-btn" data-mode="longBreak">Long (15m)</button>
        </div>

        <div class="timer-display" id="timer-display">25:00</div>

        <div class="timer-controls">
          <button type="button" class="btn btn-primary" id="timer-start-pause-btn">
            Start
          </button>
          <button type="button" class="btn btn-secondary" id="timer-reset-btn">
            Reset
          </button>
        </div>
      </div>

      <!-- Lined Legal Pad Study Goals checklist -->
      <div class="todo-card">
        <!-- Paperclip on the note -->
        <span class="paperclip" style="right: 18px; top: -12px;"></span>

        <div class="todo-header">
          <h3>Today's Study Goals</h3>
          <button type="button" class="todo-clear-btn" id="todo-clear-completed" title="Clear finished goals">
            Clear Done
          </button>
        </div>

        <form id="todo-form" class="todo-form">
          <input 
            type="text" 
            id="todo-input" 
            class="todo-input" 
            placeholder="Add a goal (e.g. Read 10 pages)..." 
            maxlength="80"
            required
            autocomplete="off"
          >
          <button type="submit" class="btn btn-primary btn-sm">Add</button>
        </form>

        <ul class="todo-list" id="todo-list-container"></ul>
      </div>

    </aside>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
